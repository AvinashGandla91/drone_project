[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-gesture-safety"
version = "0.1.0"
description = "Static hand-pose recognition and stability-gated drone command simulation"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
webcam = ["opencv-python>=4.8", "mediapipe>=0.10.14"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
drone-collect = "drone_safety.collect_dataset:main"
drone-train = "drone_safety.train_model:main"
drone-live = "drone_safety.live_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
